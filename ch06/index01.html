<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레이아웃 7가지 패턴</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
    }

    body> :not(footer, .nav-wrapper) {
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .demo-center {
      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 150px;
      background-color: #edf2fe;
    }

    .box {
      background-color: #5045e6;
      color: #eee;
      padding: 18px 40px;
      border-radius: 8px;
      font-size: 14px;
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 20px;
      height: 60px;
      background-color: #1e293c;
      color: #eee;
    }

    .nav-wrapper>nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .nav-wrapper>nav * {
      color: #ccc;
      text-decoration: none;
    }

    .demo-grid {
      display: flex;
      flex-wrap: wrap;

      gap: 20px;
      padding: 20px;
      background-color: #f9fbfc;
    }

    .card {
      flex: 1 1 200px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
      min-width: 200px;
      min-height: 100px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.1);
    }

    .demo-sidebar-layout {
      display: flex;

      min-height: 200px;
    }

    .sidebar {
      background-color: #1e293c;
      width: 200px;
      padding: 20px;
      color: #eee;
    }

    .content {
      background-color: #f1f5f9;
      flex-grow: 1;
      padding: 20px;
    }

    .demo-hero {
      background: url("https://picsum.photos/seed/hero/1200/300") center/cover;
      min-height: 225px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .demo-hero h1 {
      color: #eee;
      font-weight: bold;
      font-size: 45px;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }

    footer {
      text-align: center;
      background-color: #1e293c;
      color: #ccc;
      font-size: 12px;
      padding: 20px;
    }

    .demo-responsive {
      display: flex;
      gap: 10px;
      padding: 20px;
    }

    .col {
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #dbeafe;
      min-height: 65px;
      border-radius: 10px;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .demo-responsive {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- 1. 완전 가운데 정렬 -->
  <section class="demo-center">
    <div class="box">패턴 1: 완전 가운데</div>
  </section>

  <!-- 2. 네비게이션 바 -->
  <section class="nav-wrapper">
    <span>Logo</span>
    <nav>
      <a href="#">메뉴1</a>
      <a href="#">메뉴2</a>
      <a href="#">메뉴3</a>
    </nav>
  </section>

  <!-- 3. 카드 그리드 -->
  <section class="demo-grid">
    <div class="card">카드 1</div>
    <div class="card">카드 2</div>
    <div class="card">카드 3</div>
    <div class="card">카드 4</div>
  </section>

  <!-- 4. 사이드바 + 메인 -->
  <section class="demo-sidebar-layout">
    <aside class="sidebar">사이드바</aside>
    <div class="content">메인 콘텐츠</div>
  </section>

  <!-- 5. 히어로 섹션 -->
  <section class="demo-hero">
    <h1>히어로 섹션</h1>
  </section>

  <!-- 7. 반응형 -->
  <section class="demo-responsive">
    <div class="col">왼쪽</div>
    <div class="col">오른쪽</div>
  </section>

  <!-- 6. 스티키 푸터 -->
  <footer>
    ©2025 CSS Layout Patterns. All rights reserved.
  </footer>

</body>

</html>
