<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>깃허브 프로필 화면 클론</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="gh-header">
    <span class="gh-logo">GitHub</span>
    <input class="gh-search" type="text" placeholder="Search" />
  </header>

  <main>
    <div class="profile-layout">

      <aside class="sidebar">
        <img class="avatar" src="https://picsum.photos/id/20/200/200" alt="프로필 이미지">
        <h2>Lee Coder</h2>
        <p class="username">@lee-coder</p>
        <p class="biography">풀스택 개발자를 꿈꾸며 매일 커밋합니다.</p>
        <p class="follow-info"><strong>42</strong> followers・<strong>18</strong> following</p>

        <div class="skills">
          <span class="skills-badge html">HTML</span>
          <span class="skills-badge css">CSS</span>
          <span class="skills-badge js">JavaScript</span>
        </div>
      </aside>

      <!--  -->

      <section class="main-content">
        <h3>잔디밭 (Contribution Graph)</h3>

        <div class="grass-grid">
          <div class="grass level-0"></div>
          <div class="grass level-2"></div>
          <div class="grass level-1"></div>
          <div class="grass level-2"></div>
          <div class="grass level-0"></div>
          <div class="grass level-1"></div>
          <!--  -->
          <div class="grass level-1"></div>
          <div class="grass level-0"></div>
          <div class="grass level-2"></div>
          <div class="grass level-1"></div>
          <div class="grass level-2"></div>
          <div class="grass level-0"></div>
        </div>

        <h3>저장소 (Repositories)</h3>
        <div class="repo-card">
          <h4><a href="#">html-css-clone</a></h4>
          <p>HTML/CSS 클론 코딩 프로젝트</p>
          <p class="repo-meta">
            <span class="lang-dot html-dot"></span>
            HTML
            <span>별112</span>
          </p>
        </div>

        <div class="repo-card">
          <h4><a href="#">todo-app</a></h4>
          <p>할 일 관리 앱</p>
          <p class="repo-meta">
            <span class="lang-dot js-dot"> </span>
            JavaScript
            <span>별8</span>
          </p>
        </div>
      </section>

    </div>
  </main>

</body>

</html>
