<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    /* CSS 변수로 색상 테마 관리 */
    :root {
      --apple-black: #000000;
      --apple-gray: #86868b;
      --apple-blue: #0071e3;
      --apple-white: #f5f5f5;
      --card-bg: #1d1d1f;

      --header-height: 56px;
    }

    /* 전역 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--apple-black);
      color: var(--apple-white);
    }

    a {
      text-decoration: none;
    }

    /* 헤더 (고정 네비게이션) */
    .site-header {
      height: var(--header-height);

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 30px;

      position: fixed;
      top: 0;
      left: 0;
      width: 100%;

      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      z-index: 100;
    }

    .nav-logo {
      font-size: 20px;
      font-weight: bold;
    }

    .nav a {
      color: var(--apple-gray);
      margin-left: 25px;
    }

    .nav a:hover {
      color: white;
    }

    /* 메인의 히어로 섹션 */
    main {
      padding-top: var(--header-height);
    }

    .hero {
      height: calc(100vh - var(--header-height));

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .hero h1 {
      font-size: 56px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 26px;
      margin-bottom: 30px;
      color: var(--apple-gray);
    }

    .btn {
      padding: 12px 24px;
      border-radius: 24px;
    }

    .btn-primary {
      background-color: var(--apple-blue);
      color: white;
      margin-right: 15px;

      transition: opacity 0.3s ease;
    }

    .btn-primary:hover {
      opacity: 0.8;
    }

    .btn-secondary {
      color: var(--apple-blue);
      border: 1px solid var(--apple-blue);

      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .btn-secondary:hover {
      background-color: var(--apple-blue);
      color: white
    }

    /* 주요 특징 카드 섹션 */
    .features {
      padding: 80px 30px;
      text-align: center;
    }

    .feature-cards {
      display: flex;
      justify-content: center;

      gap: 20px;
      flex-wrap: wrap;
    }

    .features h2 {
      font-size: 36px;
      margin-bottom: 40px;
    }

    .feature-card {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      text-align: center;

      flex: 0 1 260px;

      transition: transform 0.2s ease;
    }

    .feature-card:hover {
      transform: scale(1.05);
    }

    .feature-card h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .feature-card p {
      color: var(--apple-gray);
      font-size: 15px;
    }

    footer {
      text-align: center;
      padding: 50px 20px 20px 20px;
      font-size: 14px;
      color: var(--apple-gray);
    }
  </style>

</head>

<body>
  <!-- 헤더 영역 -->
  <header class="site-header">
    <span class="nav-logo">Apple</span>
    <nav class="nav">
      <a href="#">iPhone</a>
      <a href="#">Mac</a>
      <a href="#">iPad</a>
    </nav>
  </header>


  <!-- 메인 영역 -->
  <main>
    <section class="hero">
      <h1>iPhone 17 Pro</h1>
      <p>지금까지와는 차원 다른</p>
      <div class="hero-buttons">
        <a href="#" class="btn btn-primary">더 알아보기</a>
        <a href="#" class="btn btn-secondary">구입하기</a>
      </div>
    </section>
    <section class="features">
      <h2>주요 특징</h2>
      <div class="feature-cards">
        <!-- 카드 -->
        <div class="feature-card">
          <h3>48MP 카메라</h3>
          <p>프로급 사진을 찍어보세요</p>
        </div>

        <!-- 카드 -->
        <div class="feature-card">
          <h3>A18 Pro 칩</h3>
          <p>가장 빠른 모바일 칩</p>
        </div>

        <!-- 카드 -->
        <div class="feature-card">
          <h3>하루 종일 배터리</h3>
          <p>충전 걱정 없이</p>
        </div>
      </div>
    </section>
  </main>


  <!-- 푸터 영역 -->
  <footer>
    <p>clone coding practice</p>
  </footer>

</body>

</html>
