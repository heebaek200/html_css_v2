<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠팡 클론 코딩</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <h1 class="logo">Coupang</h1>
    <div class="search-bar">
      <input type="text" placeholder="찾고 싶은 상품을 검색해보세요">
      <button>검색</button>
    </div>
  </header>

  <main class="main">
    <h2 class="section-title">오늘의 추천 상품</h2>
    <div class="product-grid">

      <!-- 샘플 카드 -->
      <div class="product-card">
        <div class="badge badge-rocket">로켓배송</div>
        <img src="https://picsum.photos/seed/prod1/250/250" alt="">
        <h3>무선 블루투스 이어폰</h3>
        <p class="price-original">59,900원</p>
        <p class="price-sale">29,900원 <span class="discount">50%</span></p>
        <p class="rating">★★★★☆ (128)</p>
        <p class="delivery">내일 도착</p>
      </div>

      <!-- 샘플 카드 -->
      <div class="product-card">
        <div class="badge badge-rocket">로켓배송</div>
        <div class="badge badge-sale">할인</div>
        <img src="https://picsum.photos/seed/prod2/250/250" alt="">
        <h3>무선 블루투스 이어폰</h3>
        <p class="price-original">59,900원</p>
        <p class="price-sale">29,900원 <span class="discount">50%</span></p>
        <p class="rating">★★★★☆ (128)</p>
        <p class="delivery">내일 도착</p>
      </div>

      <!-- 샘플 카드 -->
      <div class="product-card">
        <div class="badge badge-rocket">로켓배송</div>
        <img src="https://picsum.photos/seed/prod3/250/250" alt="">
        <h3>무선 블루투스 이어폰</h3>
        <p class="price-original">59,900원</p>
        <p class="price-sale">29,900원 <span class="discount">50%</span></p>
        <p class="rating">★★★★☆ (128)</p>
        <p class="delivery">내일 도착</p>
      </div>




    </div>
  </main>

</body>

</html>
